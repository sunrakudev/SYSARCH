<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - CCS Sit-in Monitoring</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="auth-page admin-login-page">
    <header class="admin-header">
        <div class="header-left">
            <img src="images/ucmainccslogo.png" alt="UC Logo" class="footer-logo">
            <h1>College of Computer Studies Admin Portal</h1>
        </div>
        <nav>
            <a href="landingpage.html">Back to Student Site</a>
        </nav>
    </header>

    <main class="auth-container">
        <div class="login-box admin-login-box">
            <img src="images/ucmainccslogo.png" alt="UC Logo">
            <h2>Admin Login</h2>
            <p class="admin-subtitle">Sign in to access the admin dashboard</p>

            <form id="adminLoginForm">
                <div class="field-group">
                    <label for="admin-username">Username</label>
                    <input id="admin-username" type="text" placeholder="Enter admin username" required>
                </div>

                <div class="field-group">
                    <label for="admin-password">Password</label>
                    <input id="admin-password" type="password" placeholder="Enter admin password" required>
                </div>

                <div class="auth-row">
                    <label class="check-row">
                        <input type="checkbox" name="remember">
                        <span>Remember me</span>
                    </label>
                </div>

                <button type="submit" class="btn auth-btn admin-btn">Log In</button>
            </form>
            
            <div class="admin-demo-credentials">
                <p><strong>Demo Credentials:</strong></p>
                <p>Username: <code>admin</code> | Password: <code>admin123</code></p>
            </div>
        </div>
    </main>

    <footer class="footer admin-footer">
        <img src="images/uclogo.png" alt="UC Logo" class="footer-logo">
        &copy; Coyoca 2026 Sit-In Monitoring System - Admin Portal. All rights reserved.
    </footer>
    <script src="script.js"></script>
</body>
</html>
