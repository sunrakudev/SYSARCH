<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - CCS Sit-in Monitoring</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <header>
        <div class="header-left">
            <img src="images/ucmainccslogo.png" alt="UC Logo" class="footer-logo">
            <h1>College of Computer Studies Sit-in Monitoring System</h1>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="aboutpage.html">About</a>

            <!-- Profile dropdown container - shown when logged in -->
            <div class="profile-dropdown-container" id="nav-profile-container" style="display: none;">
                <div class="profile-bubble" id="profile-bubble">
                    <img src="" alt="Profile" class="profile-avatar-img" id="profile-avatar-img" style="display: none;">
                    <span class="profile-avatar" id="profile-avatar">U</span>
                    <span class="profile-name">User</span>
                    <span class="profile-arrow">▼</span>
                </div>
                <div class="profile-dropdown-menu" id="profile-dropdown">
                    <div class="dropdown-header">
                        <img src="" alt="Profile" class="dropdown-avatar-img" id="dropdown-avatar-img" style="display: none;">
                        <span class="dropdown-avatar" id="dropdown-avatar">U</span>
                        <div class="dropdown-info">
                            <span class="dropdown-name">User Name</span>
                            <span class="dropdown-id">ID Number</span>
                        </div>
                    </div>
                    <div class="dropdown-divider"></div>
                    <a href="editprofile.html" class="dropdown-item">
                        <span class="dropdown-icon">EP</span>
                        <span>Edit Profile</span>
                    </a>
                    <a href="feedbackpage.html" class="dropdown-item">
                        <span class="dropdown-icon">FB</span>
                        <span>Feedback</span>
                    </a>
                    <a href="#" class="dropdown-item" id="theme-toggle-dropdown">
                        <span class="dropdown-icon">DM</span>
                        <span>Dark Mode</span>
                    </a>
                    <a href="#" class="dropdown-item" id="logout-btn">
                        <span class="dropdown-icon">LO</span>
                        <span>Log Out</span>
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <main class="auth-container">
        <div class="login-box">
            <div class="auth-topbar">
                <a href="index.html" class="back-btn">Back</a>
            </div>
            <img src="images/ucmainccslogo.png" alt="UC Logo">
            <h2>Edit Profile</h2>

            <div class="profile-photo-section">
                <div class="profile-photo-preview" id="profile-photo-preview">
                    <span id="profile-avatar-initials">U</span>
                </div>
                <div class="profile-photo-controls">
                    <label for="profile-photo-upload" class="btn photo-upload-btn">
                        📷 Upload Photo
                    </label>
                    <input type="file" id="profile-photo-upload" accept="image/*" style="display: none;">
                    <button type="button" class="btn photo-remove-btn" id="photo-remove-btn">Remove Photo</button>
                </div>
            </div>

            <form id="edit-profile-form">
                <div class="form-grid">
                    <div class="field-group">
                        <label for="edit-id-number">ID Number</label>
                        <input id="edit-id-number" name="idNumber" type="text" placeholder="ID Number" readonly>
                    </div>

                    <div class="field-group">
                        <label for="edit-last-name">Last Name</label>
                        <input id="edit-last-name" name="lastName" type="text" placeholder="Enter Last Name" required>
                    </div>

                    <div class="field-group">
                        <label for="edit-first-name">First Name</label>
                        <input id="edit-first-name" name="firstName" type="text" placeholder="Enter First Name" required>
                    </div>

                    <div class="field-group">
                        <label for="edit-middle-name">Middle Name</label>
                        <input id="edit-middle-name" name="middleName" type="text" placeholder="Enter Middle Name (Optional)">
                    </div>

                    <div class="field-group">
                        <label for="edit-email">Email Address</label>
                        <input id="edit-email" name="email" type="email" placeholder="e.g., student@uc.edu.ph" required>
                    </div>

                    <div class="field-group">
                        <label for="edit-course">Course</label>
                        <select id="edit-course" name="course" required>
                            <option value="" disabled selected>Select Course</option>
                            <option value="BSIT">Bachelor of Science in Information Technology</option>
                            <option value="BSCS">Bachelor of Science in Computer Science</option>
                            <option value="ACT">Associate in Computer Technology</option>
                        </select>
                    </div>

                    <div class="field-group">
                        <label for="edit-course-level">Course Level</label>
                        <select id="edit-course-level" name="courseLevel" required>
                            <option value="" disabled selected>Select Year Level</option>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>
                        </select>
                    </div>
                </div>

                <div class="field-group">
                    <label for="edit-address">Address</label>
                    <input id="edit-address" name="address" type="text" placeholder="Enter Full Address" required>
                </div>

                <div class="field-group">
                    <label for="edit-password">New Password (leave blank to keep current)</label>
                    <div class="password-input-wrapper">
                        <input id="edit-password" name="password" type="password" placeholder="Min. 6 characters (optional)" minlength="6">
                        <button type="button" class="password-toggle" data-target="edit-password">👁️</button>
                    </div>
                </div>

                <div class="field-group">
                    <label for="edit-confirm-password">Confirm New Password</label>
                    <div class="password-input-wrapper">
                        <input id="edit-confirm-password" name="confirmPassword" type="password" placeholder="Re-enter new password (optional)">
                        <button type="button" class="password-toggle" data-target="edit-confirm-password">👁️</button>
                    </div>
                </div>

                <button type="submit" class="btn auth-btn">Save Changes</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <img src="images/uclogo.png" alt="UC Logo" class="footer-logo">
        &copy; Coyoca 2026 Sit-In Monitoring System. All rights reserved.
        <a href="adminlogin.html" class="admin-link">Admin Portal</a>
    </footer>
    <script src="script.js"></script>
</body>
</html>
