<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sit-in Monitoring - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <header>
        <div class="header-left">
            <img src="images/ucmainccslogo.png" alt="UC Logo" class="footer-logo">
            <h1>College of Computer Studies Sit-in Monitoring System</h1>
        </div>
        <nav>
            <a href="index.html#home">Home</a>
            <a href="aboutpage.html">About</a>

            <!-- Profile dropdown container - shown when logged in -->
            <div class="profile-dropdown-container" id="nav-profile-container" style="display: none;">
                <div class="profile-bubble" id="profile-bubble">
                    <img src="" alt="Profile" class="profile-avatar-img" id="profile-avatar-img" style="display: none;">
                    <span class="profile-avatar" id="profile-avatar">U</span>
                    <span class="profile-name">User</span>
                    <span class="profile-arrow">▼</span>
                </div>
                <div class="profile-dropdown-menu" id="profile-dropdown">
                    <div class="dropdown-header">
                        <img src="" alt="Profile" class="dropdown-avatar-img" id="dropdown-avatar-img" style="display: none;">
                        <span class="dropdown-avatar" id="dropdown-avatar">U</span>
                        <div class="dropdown-info">
                            <span class="dropdown-name">User Name</span>
                            <span class="dropdown-id">ID Number</span>
                        </div>
                    </div>
                    <div class="dropdown-divider"></div>
                    <a href="editprofile.html" class="dropdown-item">
                        <span class="dropdown-icon">EP</span>
                        <span>Edit Profile</span>
                    </a>
                    <a href="feedbackpage.html" class="dropdown-item">
                        <span class="dropdown-icon">FB</span>
                        <span>Feedback</span>
                    </a>
                    <a href="#" class="dropdown-item" id="theme-toggle-dropdown">
                        <span class="dropdown-icon">DM</span>
                        <span>Dark Mode</span>
                    </a>
                    <a href="#" class="dropdown-item" id="logout-btn">
                        <span class="dropdown-icon">LO</span>
                        <span>Log Out</span>
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <main class="auth-container">
        <div class="login-box login-page-box">
            <div class="auth-topbar">
                <a href="index.html" class="back-btn">Back</a>
            </div>
            <img src="images/ucmainccslogo.png" alt="UC Logo">
            <h2>Sign In</h2>

            <form id="login-form">
                <div class="field-group">
                    <label for="login-id">ID Number</label>
                    <input id="login-id" name="loginId" type="text" placeholder="Enter ID Number" required>
                </div>

                <div class="field-group">
                    <label for="login-password">Password</label>
                    <div class="password-input-wrapper">
                        <input id="login-password" name="password" type="password" placeholder="Enter Password" required>
                        <button type="button" class="password-toggle" data-target="login-password">👁️</button>
                    </div>
                </div>

                <div class="auth-row">
                    <label class="check-row">
                        <input type="checkbox" name="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="text-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn auth-btn">Log In</button>
                <p class="auth-switch">No account yet? <a href="registrationpage.html">Create one</a></p>
            </form>
        </div>
    </main>

    <footer class="footer">
        <img src="images/uclogo.png" alt="UC Logo" class="footer-logo">
        &copy; 2026 Sit-In Monitoring System. All rights reserved.
        <a href="adminlogin.html" class="admin-link">Admin Portal</a>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
